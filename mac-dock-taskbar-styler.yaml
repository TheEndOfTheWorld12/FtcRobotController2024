# ============================================================================
# Mac Dock for Windows 11  —  settings for "Windows 11 Taskbar Styler" v1.10
#
# Self-contained: the dock sets its own height. Do NOT also install the
# "Taskbar height and icon size" mod — the OS26 theme authors warn that it
# fights this kind of config and pins the bar to the screen edge.
#
# Windhawk -> Windows 11 Taskbar Styler -> Settings -> Textual mode ->
# Ctrl+A, Delete, paste this, Save settings. Theme must read "(none)".
#
# Vertical budget on the 76px frame:
#   4 top margin + 1 border + 62 button + 1 border + 6 bottom margin = 74
# ============================================================================

theme: ""

styleConstants: [""]

controlStyles:

  # -- 1. Lay the taskbar out as a centered, shrink-to-fit dock -------------
  # Three columns: filler | dock | filler. The dock sits in the middle one and
  # is sized to its contents, so it grows and shrinks as apps open and close
  # while staying centered, the way the Dock does.
  - target: ':root > ScrollViewer > ScrollContentPresenter > Border > Grid'
    styles:
      - 'ColumnDefinitions:=<ColumnDefinitionCollection><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="*"/></ColumnDefinitionCollection>'
      - 'HorizontalAlignment=Stretch'
      - 'ActualWidth=>containerGridWidth'

  # Publish which edge the taskbar is docked to, so the width rule below can
  # leave a vertical taskbar alone instead of crushing it.
  - target: 'Taskbar.TaskbarFrame > Grid#RootGrid@DockingStates'
    styles:
      - 'Tag=horizontal'
      - 'Tag@DockedLeft=vertical'
      - 'Tag@DockedRight=vertical'
      - 'Tag=>taskbarDock'

  - target: 'Taskbar.TaskbarFrame'
    styles:
      - 'Grid.Column=1'
      - 'HorizontalAlignment=Center'
      - 'VerticalAlignment=Bottom'
      - 'Width={{taskbarDock==`vertical`?skip():`Auto`}}'
      - 'MinWidth=64'
      - 'MaxWidth={{containerGridWidth>0?containerGridWidth:`Infinity`}}'
      - 'Height={{taskbarDock==`vertical`?skip():76}}'
      - 'MaxHeight={{taskbarDock==`vertical`?skip():76}}'
      - 'Transitions:=<TransitionCollection><RepositionThemeTransition IsStaggeringEnabled="False"/></TransitionCollection>'

  # -- 2. The dock slab ----------------------------------------------------
  # Drop the full-width taskbar background and put the glass, border and
  # corner radius directly on the dock's own grid.
  - target: 'Taskbar.TaskbarBackground#BackgroundControl'
    styles:
      - 'Visibility=Collapsed'

  - target: 'Taskbar.TaskbarFrame > Grid#RootGrid'
    styles:
      - 'Background:=<WindhawkBlur BlurAmount="40" TintColor="#2C2C2E" TintOpacity="0.45" TintLuminosityOpacity="0.5" NoiseOpacity="0" FallbackColor="#BF2C2C2E"/>'
      - 'BorderBrush=#33FFFFFF'
      - 'BorderThickness=1'
      - 'CornerRadius=20'
      - 'Padding=8,0,8,0'
      - 'Margin=0,4,0,6'

  - target: 'Rectangle#BackgroundStroke'
    styles:
      - 'Visibility=Collapsed'

  # -- 3. Icon size and spacing -------------------------------------------
  # 48px icon on a 56px pitch gives the Dock's 8px gaps. The icon is lifted so
  # the running dot has its own lane underneath instead of touching it.
  - target: 'Grid#IconPanel > Image#Icon, Taskbar.TaskListLabeledButtonPanel#IconPanel > Image#Icon'
    styles:
      - 'Height=48'
      - 'Width=48'
      - 'Margin=0,0,0,12'

  - target: 'Taskbar.TaskListButtonPanel'
    styles:
      - 'Width=56'
      - 'Height=62'

  - target: 'Grid#IconPanel, Taskbar.TaskListLabeledButtonPanel'
    styles:
      - 'Width=56'
      - 'Height=62'

  - target: 'Taskbar.TaskListButton'
    styles:
      - 'Padding=0'
      - 'MinWidth=0'

  # No names under the icons — the Dock shows a name only as a tooltip.
  - target: 'Grid#IconPanel > TextBlock#LabelControl, Taskbar.TaskListLabeledButtonPanel > TextBlock#LabelControl'
    styles:
      - 'Visibility=Collapsed'

  # -- 4. No highlight pill behind icons ----------------------------------
  # The Dock never draws a box behind an icon, in any state.
  - target: 'Grid#IconPanel@CommonStates > Border#BackgroundElement, Taskbar.TaskListLabeledButtonPanel@CommonStates > Border#BackgroundElement'
    styles:
      - 'BorderThickness=0'
      - 'Background=Transparent'
      - 'Background@InactiveNormal=Transparent'
      - 'Background@ActiveNormal=Transparent'
      - 'Background@InactivePointerOver=Transparent'
      - 'Background@ActivePointerOver=Transparent'
      - 'Background@InactivePressed=Transparent'
      - 'Background@ActivePressed=Transparent'
      # If you are not using a magnification mod and want *some* hover
      # feedback, delete the two slashes on the next line.
      - '//Background@InactivePointerOver=#18FFFFFF'

  - target: 'Grid#IconPanel@RunningIndicatorStates > Border#BackgroundElement, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Border#BackgroundElement'
    styles:
      - 'BorderThickness=0'
      - 'Background@NoRunningIndicator=Transparent'
      - 'Background@InactiveRunningIndicator=Transparent'
      - 'Background@ActiveRunningIndicator=Transparent'
      - 'Background@InactiveRunningIndicatorPointerOver=Transparent'

  # -- 5. macOS running dots ----------------------------------------------
  # One small dot centered under every running app; nothing under a pinned app
  # that is not running. Same dot whether the app is focused or not.
  - target: 'Rectangle#RunningIndicator'
    styles:
      - 'Width=5'
      - 'Height=5'
      - 'RadiusX=2.5'
      - 'RadiusY=2.5'
      - 'StrokeThickness=0'
      - 'HorizontalAlignment=Center'
      - 'VerticalAlignment=Bottom'
      - 'Margin=0,0,0,3'

  - target: 'Grid#IconPanel@RunningIndicatorStates > Rectangle#RunningIndicator, Taskbar.TaskListLabeledButtonPanel@RunningIndicatorStates > Rectangle#RunningIndicator'
    styles:
      - 'Width@NoRunningIndicator=5'
      - 'Width@InactiveRunningIndicator=5'
      - 'Width@ActiveRunningIndicator=5'
      - 'Fill@NoRunningIndicator=Transparent'
      - 'Fill@InactiveRunningIndicator=#E6FFFFFF'
      - 'Fill@InactiveRunningIndicatorPointerOver=#E6FFFFFF'
      - 'Fill@ActiveRunningIndicator=#E6FFFFFF'

  # -- 6. Everything the Dock does not have -------------------------------
  # Start
  - target: 'Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=StartButton]'
    styles:
      - 'Visibility=Collapsed'
  - target: 'Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.Name=Start]'
    styles:
      - 'Visibility=Collapsed'

  # Search
  - target: 'Taskbar.SearchBoxButton'
    styles:
      - 'Visibility=Collapsed'
  - target: 'SearchUx.SearchUI.SearchBoxButton'
    styles:
      - 'Visibility=Collapsed'
  - target: 'SearchUx.SearchUI.SearchButtonControl'
    styles:
      - 'Visibility=Collapsed'
  - target: 'Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=SearchButton]'
    styles:
      - 'Visibility=Collapsed'
  - target: 'Grid#DynamicSearchBoxGleamContainer'
    styles:
      - 'Visibility=Collapsed'

  # Task View
  - target: 'Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=TaskViewButton]'
    styles:
      - 'Visibility=Collapsed'
  - target: 'Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.Name=Task View]'
    styles:
      - 'Visibility=Collapsed'

  # Widgets / weather
  - target: 'Taskbar.AugmentedEntryPointButton#AugmentedEntryPointButton'
    styles:
      - 'Visibility=Collapsed'
  - target: 'Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=WidgetsButton]'
    styles:
      - 'Visibility=Collapsed'

  # Copilot
  - target: 'Taskbar.TaskListButton#TaskListButton[AutomationProperties.Name=Copilot]'
    styles:
      - 'Visibility=Collapsed'

  # The entire system tray: clock, date, battery, network, volume, notification
  # bell, hidden-icon chevron and every app's tray icon.
  - target: 'SystemTray.SystemTrayFrame'
    styles:
      - 'Visibility=Collapsed'

  # Show Desktop sliver at the far right
  - target: 'SystemTray.Stack#ShowDesktopStack'
    styles:
      - 'Visibility=Collapsed'
  - target: 'SystemTray.OmniButton#ControlCenterButton[AutomationProperties.AutomationId=ShowDesktop]'
    styles:
      - 'Visibility=Collapsed'

themeResourceVariables: [""]

# The screen either side of the dock behaves like bare desktop, the way it does
# next to the Dock. Set this to 0 if you want to keep right-clicking the empty
# taskbar for Task Manager and taskbar settings. Windhawk writes booleans as
# 1 and 0 in textual mode, so this is 1, not true.
clickThroughTaskbar: 1

xamlDiagnosticsHandling: alert
